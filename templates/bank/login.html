<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATM Transaction Logging System</title>
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="bank-light-theme min-h-screen bg-slate-50 text-slate-800 font-sans flex items-center justify-center p-4 sm:p-6">

    <div class="w-full max-w-xl bg-white border border-slate-200 shadow-xl shadow-slate-200/60 rounded-2xl p-6 sm:p-8 space-y-6">
        
        <!-- Portal Brand Header -->
        <div class="border-b border-slate-200 pb-5">
            <div class="flex items-center gap-3">
                <div class="w-3.5 h-3.5 rounded-full bg-indigo-600 animate-pulse shrink-0"></div>
                <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight text-slate-900">
                    ATM Transaction Logging System
                </h1>
            </div>
        </div>

        {% if error %}
        <div class="p-3.5 rounded-xl border border-rose-200 bg-rose-50 text-rose-700 text-xs flex items-center justify-between">
            <span>{{ error }}</span>
            <button onclick="this.parentElement.remove()" class="text-rose-400 hover:text-rose-700">&times;</button>
        </div>
        {% endif %}

        {% if message %}
        <div class="p-3.5 rounded-xl border border-emerald-200 bg-emerald-50 text-emerald-700 text-xs flex items-center justify-between">
            <span>{{ message }}</span>
            <button onclick="this.parentElement.remove()" class="text-emerald-500 hover:text-emerald-800">&times;</button>
        </div>
        {% endif %}

        <!-- Standard Login Form -->
        <form action="/login" method="POST" class="space-y-4">
            <div>
                <label for="username" class="block text-xs uppercase text-slate-600 mb-1.5 font-medium tracking-wide">
                    Username
                </label>
                <input 
                    type="text" 
                    id="username" 
                    name="username" 
                    required 
                    placeholder="e.g. dba or clerk"
                    class="w-full px-3.5 py-2.5 rounded-lg text-sm bg-slate-50 border border-slate-300 text-slate-900 placeholder-slate-400 font-mono focus:outline-none focus:border-indigo-600 focus:bg-white focus:ring-1 focus:ring-indigo-600 shadow-sm transition"
                >
            </div>

            <div>
                <label for="password" class="block text-xs uppercase text-slate-600 mb-1.5 font-medium tracking-wide">
                    Password
                </label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    required 
                    placeholder="••••••••"
                    class="w-full px-3.5 py-2.5 rounded-lg text-sm bg-slate-50 border border-slate-300 text-slate-900 placeholder-slate-400 font-mono focus:outline-none focus:border-indigo-600 focus:bg-white focus:ring-1 focus:ring-indigo-600 shadow-sm transition"
                >
            </div>

            <button 
                type="submit" 
                class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 px-4 rounded-xl text-xs uppercase tracking-wider transition shadow-sm flex items-center justify-center gap-2"
            >
                <span>Sign In to Bank Portal</span>
                <span>→</span>
            </button>
        </form>

        <!-- Demo Login Section for Viva / Evaluation -->
        <div class="pt-5 border-t border-slate-200 space-y-3">
            <div class="flex items-center justify-between">
                <span class="text-xs uppercase tracking-wider text-slate-700 font-bold">1-Click Demo Profiles</span>
                <span class="text-[11px] text-slate-400 font-mono">Select role to preview</span>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
                
                <!-- DBA Demo Card -->
                <div class="p-4 rounded-xl bg-slate-50 border border-slate-200 hover:border-indigo-300 flex flex-col justify-between space-y-3 transition shadow-sm">
                    <div class="space-y-1.5">
                        <div class="flex items-center justify-between">
                            <span class="font-bold text-slate-900">Database Administrator</span>
                            <span class="px-2 py-0.5 rounded text-[10px] font-mono font-bold bg-indigo-50 text-indigo-700 border border-indigo-200">DBA</span>
                        </div>
                        <div class="text-[11px] text-slate-500 font-mono pt-1">
                            Creds: <span class="text-slate-800 font-semibold">dba</span> / <span class="text-slate-800 font-semibold">dba123</span>
                        </div>
                    </div>

                    <div class="flex items-center gap-2 pt-1">
                        <button 
                            type="button" 
                            onclick="fillDemo('dba', 'dba123')"
                            class="px-2.5 py-1.5 rounded-lg bg-white border border-slate-200 hover:bg-slate-100 text-slate-700 text-[11px] font-medium transition"
                        >
                            Fill Form
                        </button>
                        <form method="POST" action="/login" class="flex-1">
                            <input type="hidden" name="demo_role" value="dba">
                            <button 
                                type="submit" 
                                class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-1.5 px-3 rounded-lg text-[11px] transition shadow-sm flex items-center justify-center gap-1"
                            >
                                <span>⚡ Quick Login</span>
                            </button>
                        </form>
                    </div>
                </div>

                <!-- Clerk Demo Card -->
                <div class="p-4 rounded-xl bg-slate-50 border border-slate-200 hover:border-emerald-300 flex flex-col justify-between space-y-3 transition shadow-sm">
                    <div class="space-y-1.5">
                        <div class="flex items-center justify-between">
                            <span class="font-bold text-slate-900">Branch Operations</span>
                            <span class="px-2 py-0.5 rounded text-[10px] font-mono font-bold bg-emerald-50 text-emerald-700 border border-emerald-200">CLERK</span>
                        </div>
                        <div class="text-[11px] text-slate-500 font-mono pt-1">
                            Creds: <span class="text-slate-800 font-semibold">clerk</span> / <span class="text-slate-800 font-semibold">clerk123</span>
                        </div>
                    </div>

                    <div class="flex items-center gap-2 pt-1">
                        <button 
                            type="button" 
                            onclick="fillDemo('clerk', 'clerk123')"
                            class="px-2.5 py-1.5 rounded-lg bg-white border border-slate-200 hover:bg-slate-100 text-slate-700 text-[11px] font-medium transition"
                        >
                            Fill Form
                        </button>
                        <form method="POST" action="/login" class="flex-1">
                            <input type="hidden" name="demo_role" value="clerk">
                            <button 
                                type="submit" 
                                class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-1.5 px-3 rounded-lg text-[11px] transition shadow-sm flex items-center justify-center gap-1"
                            >
                                <span>⚡ Quick Login</span>
                            </button>
                        </form>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script>
        function fillDemo(username, password) {
            document.getElementById('username').value = username;
            document.getElementById('password').value = password;
            document.getElementById('username').focus();
        }
    </script>
</body>
</html>
